name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # nbgv нужна полная история

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish src\ASUMI.Producer.RabbitMQ.Service --no-build --configuration Release --output publish

      - name: Get version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: nbgv
        run: |
          dotnet tool install --global nbgv
          echo "SimpleVersion=$(nbgv get-version -v SimpleVersion)" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ASUMI.Producer.RabbitMQ.Service-${{ steps.nbgv.outputs.SimpleVersion }}
          path: publish/
          retention-days: 30